; Ultra-low-power Seeed XIAO ESP32-C6 + AHT21 temperature / humidity logger with BLE access.
;
; ESP-IDF build: the C6's LP (low-power) RISC-V core takes the readings over
; I2C while the main core and radio stay in deep sleep. The LP program lives
; in ulp/ and is built and embedded automatically (see src/CMakeLists.txt).
; See README.md for wiring, BLE protocol and power notes.

[env:esp32c6]
platform = espressif32@6.13.0
board = seeed_xiao_esp32c6
framework = espidf
monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder

; Same firmware with info-level logging enabled.
[env:esp32c6-debug]
extends = env:esp32c6
build_flags = -D TH_DEBUG=1
